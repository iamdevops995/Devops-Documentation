<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 280">
  <defs>
    <linearGradient id="sourceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <linearGradient id="buildGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="testGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="deployGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="monitorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <filter id="shadowPipe" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="950" height="280" fill="#f8fafc" rx="12"/>
  
  <!-- Title -->
  <text x="475" y="35" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#1e293b">CI/CD Pipeline</text>
  
  <!-- Pipeline line -->
  <line x1="100" y1="140" x2="850" y2="140" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Stage 1: Source -->
  <g transform="translate(60, 70)">
    <rect width="130" height="140" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2" filter="url(#shadowPipe)"/>
    <rect width="130" height="40" rx="16" fill="url(#sourceGrad)"/>
    <rect y="28" width="130" height="12" fill="url(#sourceGrad)"/>
    <text x="65" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="white">SOURCE</text>
    <text x="65" y="85" text-anchor="middle" font-family="Inter, sans-serif" font-size="32">📦</text>
    <text x="65" y="115" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Git Clone</text>
    <text x="65" y="128" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Checkout</text>
  </g>
  
  <!-- Arrow 1 -->
  <polygon points="200,140 220,130 220,150" fill="#6366f1"/>
  
  <!-- Stage 2: Build -->
  <g transform="translate(230, 70)">
    <rect width="130" height="140" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2" filter="url(#shadowPipe)"/>
    <rect width="130" height="40" rx="16" fill="url(#buildGrad)"/>
    <rect y="28" width="130" height="12" fill="url(#buildGrad)"/>
    <text x="65" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="white">BUILD</text>
    <text x="65" y="85" text-anchor="middle" font-family="Inter, sans-serif" font-size="32">🔨</text>
    <text x="65" y="115" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Compile</text>
    <text x="65" y="128" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Package</text>
  </g>
  
  <!-- Arrow 2 -->
  <polygon points="370,140 390,130 390,150" fill="#f59e0b"/>
  
  <!-- Stage 3: Test -->
  <g transform="translate(400, 70)">
    <rect width="130" height="140" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2" filter="url(#shadowPipe)"/>
    <rect width="130" height="40" rx="16" fill="url(#testGrad)"/>
    <rect y="28" width="130" height="12" fill="url(#testGrad)"/>
    <text x="65" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="white">TEST</text>
    <text x="65" y="85" text-anchor="middle" font-family="Inter, sans-serif" font-size="32">🧪</text>
    <text x="65" y="115" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Unit Tests</text>
    <text x="65" y="128" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Integration</text>
  </g>
  
  <!-- Arrow 3 -->
  <polygon points="540,140 560,130 560,150" fill="#8b5cf6"/>
  
  <!-- Stage 4: Deploy -->
  <g transform="translate(570, 70)">
    <rect width="130" height="140" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2" filter="url(#shadowPipe)"/>
    <rect width="130" height="40" rx="16" fill="url(#deployGrad)"/>
    <rect y="28" width="130" height="12" fill="url(#deployGrad)"/>
    <text x="65" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="white">DEPLOY</text>
    <text x="65" y="85" text-anchor="middle" font-family="Inter, sans-serif" font-size="32">🚀</text>
    <text x="65" y="115" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Staging</text>
    <text x="65" y="128" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Production</text>
  </g>
  
  <!-- Arrow 4 -->
  <polygon points="710,140 730,130 730,150" fill="#10b981"/>
  
  <!-- Stage 5: Monitor -->
  <g transform="translate(740, 70)">
    <rect width="130" height="140" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2" filter="url(#shadowPipe)"/>
    <rect width="130" height="40" rx="16" fill="url(#monitorGrad)"/>
    <rect y="28" width="130" height="12" fill="url(#monitorGrad)"/>
    <text x="65" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="white">MONITOR</text>
    <text x="65" y="85" text-anchor="middle" font-family="Inter, sans-serif" font-size="32">📊</text>
    <text x="65" y="115" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Logs</text>
    <text x="65" y="128" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Metrics</text>
  </g>
  
  <!-- Feedback loop arrow -->
  <path d="M 870 140 Q 890 140 890 200 Q 890 250 475 250 Q 60 250 60 200 Q 60 160 80 145" 
        fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="80,140 70,152 90,152" fill="#94a3b8"/>
  <text x="475" y="268" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#94a3b8">Continuous Feedback Loop</text>
</svg>