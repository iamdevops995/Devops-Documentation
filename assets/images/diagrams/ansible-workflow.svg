<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="step1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="step2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="step3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="step4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="step5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="200" fill="#f8fafc" rx="12"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#1e293b">Ansible Workflow</text>
  
  <!-- Step 1: Write Inventory -->
  <rect x="30" y="55" width="130" height="120" rx="12" fill="white" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow2)"/>
  <circle cx="95" cy="85" r="22" fill="url(#step1)"/>
  <text x="95" y="92" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="white">1</text>
  <text x="95" y="125" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#1e293b">Write</text>
  <text x="95" y="142" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#1e293b">Inventory</text>
  <text x="95" y="165" text-anchor="middle" font-family="Inter, sans-serif" font-size="18">📋</text>
  
  <!-- Arrow 1 -->
  <polygon points="170,115 185,105 185,125" fill="#3b82f6"/>
  <line x1="160" y1="115" x2="175" y2="115" stroke="#3b82f6" stroke-width="3"/>
  
  <!-- Step 2: Verify Connection -->
  <rect x="200" y="55" width="130" height="120" rx="12" fill="white" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow2)"/>
  <circle cx="265" cy="85" r="22" fill="url(#step2)"/>
  <text x="265" y="92" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="white">2</text>
  <text x="265" y="125" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#1e293b">Verify</text>
  <text x="265" y="142" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#1e293b">Connection</text>
  <text x="265" y="165" text-anchor="middle" font-family="Inter, sans-serif" font-size="18">🔗</text>
  
  <!-- Arrow 2 -->
  <polygon points="340,115 355,105 355,125" fill="#8b5cf6"/>
  <line x1="330" y1="115" x2="345" y2="115" stroke="#8b5cf6" stroke-width="3"/>
  
  <!-- Step 3: Write Playbook -->
  <rect x="370" y="55" width="130" height="120" rx="12" fill="white" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow2)"/>
  <circle cx="435" cy="85" r="22" fill="url(#step3)"/>
  <text x="435" y="92" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="white">3</text>
  <text x="435" y="125" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#1e293b">Write</text>
  <text x="435" y="142" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#1e293b">Playbook</text>
  <text x="435" y="165" text-anchor="middle" font-family="Inter, sans-serif" font-size="18">📝</text>
  
  <!-- Arrow 3 -->
  <polygon points="510,115 525,105 525,125" fill="#f59e0b"/>
  <line x1="500" y1="115" x2="515" y2="115" stroke="#f59e0b" stroke-width="3"/>
  
  <!-- Step 4: Execute -->
  <rect x="540" y="55" width="130" height="120" rx="12" fill="white" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow2)"/>
  <circle cx="605" cy="85" r="22" fill="url(#step4)"/>
  <text x="605" y="92" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="white">4</text>
  <text x="605" y="125" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#1e293b">Execute</text>
  <text x="605" y="142" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#1e293b">Playbook</text>
  <text x="605" y="165" text-anchor="middle" font-family="Inter, sans-serif" font-size="18">▶️</text>
  
  <!-- Arrow 4 -->
  <polygon points="680,115 695,105 695,125" fill="#10b981"/>
  <line x1="670" y1="115" x2="685" y2="115" stroke="#10b981" stroke-width="3"/>
  
  <!-- Step 5: Verify Results -->
  <rect x="710" y="55" width="130" height="120" rx="12" fill="white" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow2)"/>
  <circle cx="775" cy="85" r="22" fill="url(#step5)"/>
  <text x="775" y="92" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="white">5</text>
  <text x="775" y="125" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#1e293b">Verify</text>
  <text x="775" y="142" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#1e293b">Results</text>
  <text x="775" y="165" text-anchor="middle" font-family="Inter, sans-serif" font-size="18">✅</text>
</svg>