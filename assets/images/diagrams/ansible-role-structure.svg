<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 480">
  <defs>
    <linearGradient id="folderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="fileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="750" height="480" fill="#f8fafc" rx="12"/>
  
  <!-- Title -->
  <text x="375" y="35" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#1e293b">Ansible Role Directory Structure</text>
  
  <!-- Root folder -->
  <rect x="50" y="60" width="650" height="400" rx="12" fill="white" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow4)"/>
  
  <!-- roles/ header -->
  <rect x="50" y="60" width="650" height="40" rx="12" fill="url(#folderGrad)"/>
  <rect x="50" y="88" width="650" height="12" fill="url(#folderGrad)"/>
  <text x="75" y="87" font-family="JetBrains Mono, monospace" font-size="14" fill="white" font-weight="600">📁 roles/</text>
  
  <!-- webserver/ folder -->
  <rect x="80" y="115" width="590" height="330" rx="10" fill="#f8fafc" stroke="#3b82f6" stroke-width="1"/>
  <text x="105" y="138" font-family="JetBrains Mono, monospace" font-size="13" fill="#1d4ed8" font-weight="600">📁 webserver/</text>
  
  <!-- defaults/ -->
  <g transform="translate(110, 155)">
    <rect width="250" height="50" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
    <text x="15" y="22" font-family="JetBrains Mono, monospace" font-size="12" fill="#1d4ed8" font-weight="600">📁 defaults/</text>
    <text x="25" y="40" font-family="JetBrains Mono, monospace" font-size="11" fill="#64748b">📄 main.yml</text>
    <text x="130" y="40" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8">Default variables</text>
  </g>
  
  <!-- vars/ -->
  <g transform="translate(380, 155)">
    <rect width="250" height="50" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="15" y="22" font-family="JetBrains Mono, monospace" font-size="12" fill="#166534" font-weight="600">📁 vars/</text>
    <text x="25" y="40" font-family="JetBrains Mono, monospace" font-size="11" fill="#64748b">📄 main.yml</text>
    <text x="130" y="40" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8">Role variables</text>
  </g>
  
  <!-- tasks/ -->
  <g transform="translate(110, 220)">
    <rect width="250" height="50" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
    <text x="15" y="22" font-family="JetBrains Mono, monospace" font-size="12" fill="#92400e" font-weight="600">📁 tasks/</text>
    <text x="25" y="40" font-family="JetBrains Mono, monospace" font-size="11" fill="#64748b">📄 main.yml</text>
    <text x="130" y="40" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8">Task definitions</text>
  </g>
  
  <!-- handlers/ -->
  <g transform="translate(380, 220)">
    <rect width="250" height="50" rx="8" fill="#fce7f3" stroke="#f9a8d4" stroke-width="1"/>
    <text x="15" y="22" font-family="JetBrains Mono, monospace" font-size="12" fill="#9d174d" font-weight="600">📁 handlers/</text>
    <text x="25" y="40" font-family="JetBrains Mono, monospace" font-size="11" fill="#64748b">📄 main.yml</text>
    <text x="130" y="40" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8">Handler definitions</text>
  </g>
  
  <!-- templates/ -->
  <g transform="translate(110, 285)">
    <rect width="250" height="50" rx="8" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1"/>
    <text x="15" y="22" font-family="JetBrains Mono, monospace" font-size="12" fill="#3730a3" font-weight="600">📁 templates/</text>
    <text x="25" y="40" font-family="JetBrains Mono, monospace" font-size="11" fill="#64748b">📄 config.conf.j2</text>
    <text x="155" y="40" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8">Jinja2 templates</text>
  </g>
  
  <!-- files/ -->
  <g transform="translate(380, 285)">
    <rect width="250" height="50" rx="8" fill="#ccfbf1" stroke="#5eead4" stroke-width="1"/>
    <text x="15" y="22" font-family="JetBrains Mono, monospace" font-size="12" fill="#115e59" font-weight="600">📁 files/</text>
    <text x="25" y="40" font-family="JetBrains Mono, monospace" font-size="11" fill="#64748b">📄 index.html</text>
    <text x="130" y="40" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8">Static files</text>
  </g>
  
  <!-- meta/ -->
  <g transform="translate(110, 350)">
    <rect width="250" height="50" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="15" y="22" font-family="JetBrains Mono, monospace" font-size="12" fill="#991b1b" font-weight="600">📁 meta/</text>
    <text x="25" y="40" font-family="JetBrains Mono, monospace" font-size="11" fill="#64748b">📄 main.yml</text>
    <text x="130" y="40" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8">Role dependencies</text>
  </g>
  
  <!-- README -->
  <g transform="translate(380, 350)">
    <rect width="250" height="50" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="15" y="32" font-family="JetBrains Mono, monospace" font-size="12" fill="#475569" font-weight="600">📄 README.md</text>
    <text x="140" y="32" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8">Documentation</text>
  </g>
  
  <!-- Legend arrow -->
  <text x="110" y="430" font-family="Inter, sans-serif" font-size="10" fill="#64748b">📁 = Directory</text>
  <text x="220" y="430" font-family="Inter, sans-serif" font-size="10" fill="#64748b">📄 = File</text>
  <text x="310" y="430" font-family="Inter, sans-serif" font-size="10" fill="#64748b">.j2 = Jinja2 Template</text>
</svg>