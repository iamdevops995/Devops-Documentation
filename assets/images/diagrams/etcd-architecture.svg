<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
  <defs>
    <!-- Gradients -->
    <linearGradient id="etcdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#419EDA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D5AA3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="k8sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#326CE5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A4B9C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="backupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#48BB78;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2F855A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="storageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ED8936;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C05621;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    
    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#48BB78"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#326CE5"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="700" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1a202c">ETCD Architecture & Backup Process</text>
  
  <!-- Kubernetes Control Plane Section -->
  <rect x="30" y="70" width="400" height="280" rx="10" fill="#EBF4FF" stroke="#326CE5" stroke-width="2"/>
  <text x="230" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#326CE5">Kubernetes Control Plane</text>
  
  <!-- API Server -->
  <rect x="60" y="120" width="140" height="60" rx="8" fill="url(#k8sGrad)" filter="url(#shadow)"/>
  <text x="130" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">kube-apiserver</text>
  <text x="130" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E2E8F0">REST API Interface</text>
  
  <!-- Controller Manager -->
  <rect x="60" y="200" width="140" height="60" rx="8" fill="url(#k8sGrad)" filter="url(#shadow)"/>
  <text x="130" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">controller-manager</text>
  <text x="130" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E2E8F0">State Management</text>
  
  <!-- Scheduler -->
  <rect x="60" y="280" width="140" height="60" rx="8" fill="url(#k8sGrad)" filter="url(#shadow)"/>
  <text x="130" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">kube-scheduler</text>
  <text x="130" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E2E8F0">Pod Placement</text>
  
  <!-- ETCD Cluster Section -->
  <rect x="250" y="120" width="160" height="220" rx="10" fill="#E6F6FF" stroke="#419EDA" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="330" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#419EDA">ETCD Cluster</text>
  
  <!-- ETCD Leader -->
  <rect x="270" y="160" width="120" height="50" rx="8" fill="url(#etcdGrad)" filter="url(#shadow)"/>
  <text x="330" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">ETCD Leader</text>
  <text x="330" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#E2E8F0">Write Operations</text>
  
  <!-- ETCD Follower 1 -->
  <rect x="270" y="220" width="120" height="45" rx="8" fill="url(#etcdGrad)" filter="url(#shadow)" opacity="0.8"/>
  <text x="330" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">ETCD Follower</text>
  <text x="330" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#E2E8F0">Replica Node</text>
  
  <!-- ETCD Follower 2 -->
  <rect x="270" y="275" width="120" height="45" rx="8" fill="url(#etcdGrad)" filter="url(#shadow)" opacity="0.8"/>
  <text x="330" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">ETCD Follower</text>
  <text x="330" y="313" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#E2E8F0">Replica Node</text>
  
  <!-- Connection lines from K8s components to ETCD -->
  <line x1="200" y1="150" x2="268" y2="185" stroke="#326CE5" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <line x1="200" y1="230" x2="268" y2="200" stroke="#666" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="200" y1="310" x2="268" y2="280" stroke="#666" stroke-width="1.5" stroke-dasharray="4,2"/>
  
  <!-- Raft Consensus arrows between ETCD nodes -->
  <path d="M330 210 L330 218" stroke="#419EDA" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <path d="M330 265 L330 273" stroke="#419EDA" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Data stored in ETCD -->
  <rect x="460" y="70" width="250" height="280" rx="10" fill="#FFF5F5" stroke="#E53E3E" stroke-width="2"/>
  <text x="585" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#E53E3E">Data Stored in ETCD</text>
  
  <!-- Data items -->
  <rect x="480" y="115" width="90" height="35" rx="5" fill="#FED7D7"/>
  <text x="525" y="137" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C53030">Cluster State</text>
  
  <rect x="580" y="115" width="90" height="35" rx="5" fill="#FED7D7"/>
  <text x="625" y="137" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C53030">Nodes</text>
  
  <rect x="480" y="160" width="90" height="35" rx="5" fill="#FED7D7"/>
  <text x="525" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C53030">Pods</text>
  
  <rect x="580" y="160" width="90" height="35" rx="5" fill="#FED7D7"/>
  <text x="625" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C53030">Services</text>
  
  <rect x="480" y="205" width="90" height="35" rx="5" fill="#FED7D7"/>
  <text x="525" y="227" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C53030">ConfigMaps</text>
  
  <rect x="580" y="205" width="90" height="35" rx="5" fill="#FED7D7"/>
  <text x="625" y="227" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C53030">Secrets</text>
  
  <rect x="480" y="250" width="90" height="35" rx="5" fill="#FED7D7"/>
  <text x="525" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C53030">RBAC</text>
  
  <rect x="580" y="250" width="90" height="35" rx="5" fill="#FED7D7"/>
  <text x="625" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C53030">Namespaces</text>
  
  <rect x="480" y="295" width="190" height="35" rx="5" fill="#FED7D7"/>
  <text x="575" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C53030">Custom Resources (CRDs)</text>
  
  <!-- Arrow from ETCD to Data -->
  <line x1="412" y1="210" x2="455" y2="210" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Backup Process Section -->
  <rect x="30" y="380" width="680" height="290" rx="10" fill="#F0FFF4" stroke="#48BB78" stroke-width="2"/>
  <text x="370" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2F855A">ETCD Backup & Restore Process</text>
  
  <!-- Backup Steps -->
  <!-- Step 1: etcdctl -->
  <rect x="60" y="430" width="130" height="70" rx="8" fill="url(#backupGrad)" filter="url(#shadow)"/>
  <text x="125" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">1. etcdctl</text>
  <text x="125" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#E2E8F0">snapshot save</text>
  <text x="125" y="492" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#E2E8F0">command</text>
  
  <!-- Step 2: Snapshot File -->
  <rect x="230" y="430" width="130" height="70" rx="8" fill="url(#storageGrad)" filter="url(#shadow)"/>
  <text x="295" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">2. Snapshot</text>
  <text x="295" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#E2E8F0">etcd-backup.db</text>
  <text x="295" y="492" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#E2E8F0">Binary file</text>
  
  <!-- Step 3: Remote Storage -->
  <rect x="400" y="430" width="130" height="70" rx="8" fill="#805AD5" filter="url(#shadow)"/>
  <text x="465" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">3. Remote</text>
  <text x="465" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#E2E8F0">S3 / NFS / Cloud</text>
  <text x="465" y="492" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#E2E8F0">Storage</text>
  
  <!-- Step 4: Restore -->
  <rect x="570" y="430" width="120" height="70" rx="8" fill="url(#backupGrad)" filter="url(#shadow)"/>
  <text x="630" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">4. Restore</text>
  <text x="630" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#E2E8F0">snapshot restore</text>
  <text x="630" y="492" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#E2E8F0">--data-dir</text>
  
  <!-- Arrows between backup steps -->
  <line x1="192" y1="465" x2="225" y2="465" stroke="#48BB78" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <line x1="362" y1="465" x2="395" y2="465" stroke="#48BB78" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <line x1="532" y1="465" x2="565" y2="465" stroke="#48BB78" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  
  <!-- Backup Commands Box -->
  <rect x="60" y="520" width="300" height="130" rx="8" fill="#1a202c" filter="url(#shadow)"/>
  <text x="80" y="545" font-family="monospace" font-size="10" fill="#48BB78"># Create backup</text>
  <text x="80" y="565" font-family="monospace" font-size="9" fill="#E2E8F0">etcdctl snapshot save backup.db \</text>
  <text x="90" y="580" font-family="monospace" font-size="9" fill="#E2E8F0">--endpoints=https://127.0.0.1:2379 \</text>
  <text x="90" y="595" font-family="monospace" font-size="9" fill="#E2E8F0">--cacert=ca.crt --cert=server.crt \</text>
  <text x="90" y="610" font-family="monospace" font-size="9" fill="#E2E8F0">--key=server.key</text>
  <text x="80" y="635" font-family="monospace" font-size="10" fill="#48BB78"># Verify: etcdctl snapshot status</text>
  
  <!-- Restore Commands Box -->
  <rect x="380" y="520" width="310" height="130" rx="8" fill="#1a202c" filter="url(#shadow)"/>
  <text x="400" y="545" font-family="monospace" font-size="10" fill="#ED8936"># Restore backup</text>
  <text x="400" y="565" font-family="monospace" font-size="9" fill="#E2E8F0">etcdctl snapshot restore backup.db \</text>
  <text x="410" y="580" font-family="monospace" font-size="9" fill="#E2E8F0">--data-dir=/var/lib/etcd-new \</text>
  <text x="410" y="595" font-family="monospace" font-size="9" fill="#E2E8F0">--initial-cluster=master=https://...</text>
  <text x="400" y="620" font-family="monospace" font-size="10" fill="#ED8936"># Then update etcd.yaml & restart</text>
  <text x="400" y="635" font-family="monospace" font-size="9" fill="#E2E8F0">systemctl restart kubelet</text>
  
  <!-- Certificate Files Section -->
  <rect x="740" y="70" width="230" height="280" rx="10" fill="#FFFAF0" stroke="#DD6B20" stroke-width="2"/>
  <text x="855" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#DD6B20">Certificate Files</text>
  
  <!-- Certificate items -->
  <rect x="760" y="115" width="190" height="45" rx="5" fill="#FEEBC8"/>
  <text x="855" y="137" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#C05621">CA Certificate</text>
  <text x="855" y="152" text-anchor="middle" font-family="monospace" font-size="8" fill="#744210">/etc/kubernetes/pki/etcd/ca.crt</text>
  
  <rect x="760" y="170" width="190" height="45" rx="5" fill="#FEEBC8"/>
  <text x="855" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#C05621">Server Certificate</text>
  <text x="855" y="207" text-anchor="middle" font-family="monospace" font-size="8" fill="#744210">/etc/.../etcd/server.crt</text>
  
  <rect x="760" y="225" width="190" height="45" rx="5" fill="#FEEBC8"/>
  <text x="855" y="247" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#C05621">Server Key</text>
  <text x="855" y="262" text-anchor="middle" font-family="monospace" font-size="8" fill="#744210">/etc/.../etcd/server.key</text>
  
  <rect x="760" y="280" width="190" height="55" rx="5" fill="#FED7AA"/>
  <text x="855" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#9C4221">API Version</text>
  <text x="855" y="320" text-anchor="middle" font-family="monospace" font-size="9" fill="#744210">export ETCDCTL_API=3</text>
  
  <!-- Best Practices Section -->
  <rect x="740" y="380" width="230" height="290" rx="10" fill="#EDF2F7" stroke="#4A5568" stroke-width="2"/>
  <text x="855" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2D3748">Best Practices</text>
  
  <text x="760" y="435" font-family="Arial, sans-serif" font-size="11" fill="#2D3748">✓ Backup every 1-2 hours (prod)</text>
  <text x="760" y="460" font-family="Arial, sans-serif" font-size="11" fill="#2D3748">✓ Store in multiple locations</text>
  <text x="760" y="485" font-family="Arial, sans-serif" font-size="11" fill="#2D3748">✓ Encrypt backup files</text>
  <text x="760" y="510" font-family="Arial, sans-serif" font-size="11" fill="#2D3748">✓ Test restore regularly</text>
  <text x="760" y="535" font-family="Arial, sans-serif" font-size="11" fill="#2D3748">✓ Monitor backup success</text>
  <text x="760" y="560" font-family="Arial, sans-serif" font-size="11" fill="#2D3748">✓ Automate with CronJob</text>
  <text x="760" y="585" font-family="Arial, sans-serif" font-size="11" fill="#2D3748">✓ Retain 7-30 days of backups</text>
  <text x="760" y="610" font-family="Arial, sans-serif" font-size="11" fill="#2D3748">✓ Document restore procedure</text>
  
  <text x="760" y="645" font-family="Arial, sans-serif" font-size="11" fill="#E53E3E">✗ Don't store on same server</text>
  
  <!-- Legend -->
  <rect x="30" y="675" width="940" height="20" fill="none"/>
  <rect x="50" y="678" width="15" height="12" fill="url(#k8sGrad)" rx="2"/>
  <text x="70" y="688" font-family="Arial, sans-serif" font-size="10" fill="#666">K8s Components</text>
  <rect x="180" y="678" width="15" height="12" fill="url(#etcdGrad)" rx="2"/>
  <text x="200" y="688" font-family="Arial, sans-serif" font-size="10" fill="#666">ETCD Nodes</text>
  <rect x="290" y="678" width="15" height="12" fill="url(#backupGrad)" rx="2"/>
  <text x="310" y="688" font-family="Arial, sans-serif" font-size="10" fill="#666">Backup Process</text>
  <rect x="420" y="678" width="15" height="12" fill="url(#storageGrad)" rx="2"/>
  <text x="440" y="688" font-family="Arial, sans-serif" font-size="10" fill="#666">Snapshot Storage</text>
</svg>
