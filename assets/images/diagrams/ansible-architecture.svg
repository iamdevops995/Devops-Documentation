<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#f8fafc" rx="12"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#1e293b">Ansible Architecture</text>
  
  <!-- Control Node Box -->
  <rect x="100" y="60" width="600" height="180" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="100" y="60" width="600" height="45" rx="16" fill="url(#blueGrad)"/>
  <rect x="100" y="89" width="600" height="16" fill="url(#blueGrad)"/>
  <text x="400" y="90" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="white">CONTROL NODE</text>
  
  <!-- Playbooks -->
  <rect x="140" y="125" width="140" height="90" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="210" y="160" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#1e40af">Playbooks</text>
  <text x="210" y="182" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#64748b">(YAML)</text>
  <text x="210" y="202" text-anchor="middle" font-family="Inter, sans-serif" font-size="20">📝</text>
  
  <!-- Inventory -->
  <rect x="330" y="125" width="140" height="90" rx="10" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
  <text x="400" y="160" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#166534">Inventory</text>
  <text x="400" y="182" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#64748b">(hosts)</text>
  <text x="400" y="202" text-anchor="middle" font-family="Inter, sans-serif" font-size="20">📋</text>
  
  <!-- Modules -->
  <rect x="520" y="125" width="140" height="90" rx="10" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="590" y="160" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#6b21a8">Modules</text>
  <text x="590" y="182" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#64748b">(Python)</text>
  <text x="590" y="202" text-anchor="middle" font-family="Inter, sans-serif" font-size="20">🔧</text>
  
  <!-- Connection Arrow -->
  <line x1="400" y1="240" x2="400" y2="290" stroke="#3b82f6" stroke-width="3" stroke-dasharray="8,4"/>
  <polygon points="400,305 390,290 410,290" fill="#3b82f6"/>
  
  <!-- SSH/WinRM Label -->
  <rect x="320" y="255" width="160" height="30" rx="15" fill="#3b82f6"/>
  <text x="400" y="275" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="white">SSH / WinRM</text>
  
  <!-- Managed Nodes -->
  <text x="400" y="340" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#64748b">MANAGED NODES</text>
  
  <!-- Web Server -->
  <rect x="100" y="360" width="160" height="110" rx="12" fill="white" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="100" y="360" width="160" height="35" rx="12" fill="url(#greenGrad)"/>
  <rect x="100" y="383" width="160" height="12" fill="url(#greenGrad)"/>
  <text x="180" y="385" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="white">Web Server</text>
  <text x="180" y="425" text-anchor="middle" font-family="Inter, sans-serif" font-size="28">🌐</text>
  <text x="180" y="455" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#64748b">Linux</text>
  
  <!-- DB Server -->
  <rect x="320" y="360" width="160" height="110" rx="12" fill="white" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="320" y="360" width="160" height="35" rx="12" fill="url(#purpleGrad)"/>
  <rect x="320" y="383" width="160" height="12" fill="url(#purpleGrad)"/>
  <text x="400" y="385" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="white">DB Server</text>
  <text x="400" y="425" text-anchor="middle" font-family="Inter, sans-serif" font-size="28">🗄️</text>
  <text x="400" y="455" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#64748b">Linux</text>
  
  <!-- App Server -->
  <rect x="540" y="360" width="160" height="110" rx="12" fill="white" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="540" y="360" width="160" height="35" rx="12" fill="url(#orangeGrad)"/>
  <rect x="540" y="383" width="160" height="12" fill="url(#orangeGrad)"/>
  <text x="620" y="385" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="white">App Server</text>
  <text x="620" y="425" text-anchor="middle" font-family="Inter, sans-serif" font-size="28">⚙️</text>
  <text x="620" y="455" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#64748b">Windows</text>
  
  <!-- Connection lines to servers -->
  <line x1="400" y1="305" x2="180" y2="360" stroke="#94a3b8" stroke-width="2"/>
  <line x1="400" y1="305" x2="400" y2="360" stroke="#94a3b8" stroke-width="2"/>
  <line x1="400" y1="305" x2="620" y2="360" stroke="#94a3b8" stroke-width="2"/>
</svg>