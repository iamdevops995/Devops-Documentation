<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <defs>
    <linearGradient id="masterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="workerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="podGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <filter id="shadowK8s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="600" fill="#f8fafc" rx="12"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#1e293b">Kubernetes Architecture</text>
  
  <!-- Control Plane Box -->
  <rect x="50" y="60" width="800" height="200" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2" filter="url(#shadowK8s)"/>
  <rect x="50" y="60" width="800" height="50" rx="16" fill="url(#masterGrad)"/>
  <rect x="50" y="94" width="800" height="16" fill="url(#masterGrad)"/>
  <text x="450" y="93" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="white">CONTROL PLANE (Master Node)</text>
  
  <!-- API Server -->
  <rect x="80" y="130" width="160" height="110" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="160" y="160" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#1d4ed8">API Server</text>
  <text x="160" y="195" text-anchor="middle" font-family="Inter, sans-serif" font-size="28">🔌</text>
  <text x="160" y="225" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">REST API endpoint</text>
  
  <!-- etcd -->
  <rect x="270" y="130" width="160" height="110" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="350" y="160" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#92400e">etcd</text>
  <text x="350" y="195" text-anchor="middle" font-family="Inter, sans-serif" font-size="28">💾</text>
  <text x="350" y="225" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Key-value store</text>
  
  <!-- Scheduler -->
  <rect x="460" y="130" width="160" height="110" rx="10" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
  <text x="540" y="160" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#166534">Scheduler</text>
  <text x="540" y="195" text-anchor="middle" font-family="Inter, sans-serif" font-size="28">📋</text>
  <text x="540" y="225" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Pod placement</text>
  
  <!-- Controller Manager -->
  <rect x="650" y="130" width="170" height="110" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
  <text x="735" y="160" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#9d174d">Controller Mgr</text>
  <text x="735" y="195" text-anchor="middle" font-family="Inter, sans-serif" font-size="28">⚙️</text>
  <text x="735" y="225" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Node, Replication</text>
  
  <!-- Connection lines -->
  <line x1="450" y1="260" x2="450" y2="300" stroke="#3b82f6" stroke-width="3" stroke-dasharray="8,4"/>
  <text x="450" y="290" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#3b82f6">kubectl / API</text>
  
  <!-- Worker Nodes Label -->
  <text x="450" y="330" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#64748b">WORKER NODES</text>
  
  <!-- Worker Node 1 -->
  <rect x="50" y="350" width="260" height="230" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2" filter="url(#shadowK8s)"/>
  <rect x="50" y="350" width="260" height="40" rx="16" fill="url(#workerGrad)"/>
  <rect x="50" y="378" width="260" height="12" fill="url(#workerGrad)"/>
  <text x="180" y="378" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="white">Worker Node 1</text>
  
  <!-- Kubelet -->
  <rect x="70" y="405" width="100" height="50" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
  <text x="120" y="428" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#4338ca">kubelet</text>
  <text x="120" y="445" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Agent</text>
  
  <!-- kube-proxy -->
  <rect x="190" y="405" width="100" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="240" y="428" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#92400e">kube-proxy</text>
  <text x="240" y="445" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Network</text>
  
  <!-- Pod 1 -->
  <rect x="70" y="470" width="100" height="90" rx="8" fill="url(#podGrad)"/>
  <text x="120" y="495" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="white">Pod</text>
  <rect x="85" y="505" width="70" height="45" rx="6" fill="white" fill-opacity="0.9"/>
  <text x="120" y="525" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#7c3aed">Container</text>
  <text x="120" y="542" text-anchor="middle" font-family="Inter, sans-serif" font-size="14">📦</text>
  
  <!-- Pod 2 -->
  <rect x="190" y="470" width="100" height="90" rx="8" fill="url(#podGrad)"/>
  <text x="240" y="495" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="white">Pod</text>
  <rect x="205" y="505" width="70" height="45" rx="6" fill="white" fill-opacity="0.9"/>
  <text x="240" y="525" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#7c3aed">Container</text>
  <text x="240" y="542" text-anchor="middle" font-family="Inter, sans-serif" font-size="14">📦</text>
  
  <!-- Worker Node 2 -->
  <rect x="340" y="350" width="260" height="230" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2" filter="url(#shadowK8s)"/>
  <rect x="340" y="350" width="260" height="40" rx="16" fill="url(#workerGrad)"/>
  <rect x="340" y="378" width="260" height="12" fill="url(#workerGrad)"/>
  <text x="470" y="378" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="white">Worker Node 2</text>
  
  <!-- Kubelet 2 -->
  <rect x="360" y="405" width="100" height="50" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
  <text x="410" y="428" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#4338ca">kubelet</text>
  <text x="410" y="445" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Agent</text>
  
  <!-- kube-proxy 2 -->
  <rect x="480" y="405" width="100" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="530" y="428" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#92400e">kube-proxy</text>
  <text x="530" y="445" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Network</text>
  
  <!-- Pod 3 -->
  <rect x="360" y="470" width="100" height="90" rx="8" fill="url(#podGrad)"/>
  <text x="410" y="495" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="white">Pod</text>
  <rect x="375" y="505" width="70" height="45" rx="6" fill="white" fill-opacity="0.9"/>
  <text x="410" y="525" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#7c3aed">Container</text>
  <text x="410" y="542" text-anchor="middle" font-family="Inter, sans-serif" font-size="14">📦</text>
  
  <!-- Pod 4 -->
  <rect x="480" y="470" width="100" height="90" rx="8" fill="url(#podGrad)"/>
  <text x="530" y="495" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="white">Pod</text>
  <rect x="495" y="505" width="70" height="45" rx="6" fill="white" fill-opacity="0.9"/>
  <text x="530" y="525" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#7c3aed">Container</text>
  <text x="530" y="542" text-anchor="middle" font-family="Inter, sans-serif" font-size="14">📦</text>
  
  <!-- Legend -->
  <rect x="630" y="360" width="210" height="210" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="735" y="385" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#1e293b">Legend</text>
  
  <rect x="650" y="400" width="16" height="16" rx="3" fill="url(#masterGrad)"/>
  <text x="675" y="413" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Control Plane</text>
  
  <rect x="650" y="425" width="16" height="16" rx="3" fill="url(#workerGrad)"/>
  <text x="675" y="438" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Worker Node</text>
  
  <rect x="650" y="450" width="16" height="16" rx="3" fill="url(#podGrad)"/>
  <text x="675" y="463" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Pod</text>
  
  <rect x="650" y="475" width="16" height="16" rx="3" fill="white" stroke="#e2e8f0"/>
  <text x="675" y="488" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Container</text>
  
  <!-- Components list -->
  <text x="650" y="515" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8">• API Server: Entry point</text>
  <text x="650" y="530" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8">• etcd: Cluster state</text>
  <text x="650" y="545" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8">• Scheduler: Pod placement</text>
  <text x="650" y="560" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8">• kubelet: Node agent</text>
</svg>