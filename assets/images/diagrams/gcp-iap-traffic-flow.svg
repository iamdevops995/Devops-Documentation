<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4ade80"/>
    </marker>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#60a5fa" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="500" fill="#0f172a"/>
  
  <!-- Title -->
  <text x="450" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc" text-anchor="middle">GCP IAP SSH Traffic Flow</text>
  
  <!-- Step 1: Local Machine -->
  <rect x="50" y="70" width="140" height="80" rx="10" fill="url(#purpleGrad)" filter="url(#glow)"/>
  <text x="120" y="100" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1. Local PC</text>
  <text x="120" y="118" font-family="Arial, sans-serif" font-size="9" fill="#e9d5ff" text-anchor="middle">gcloud CLI</text>
  <text x="120" y="135" font-family="Arial, sans-serif" font-size="9" fill="#e9d5ff" text-anchor="middle">SSH Client</text>
  
  <!-- Arrow 1-2 -->
  <path d="M190 110 L250 110" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="220" y="100" font-family="Arial, sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">IAP Tunnel</text>
  
  <!-- Step 2: IAP -->
  <rect x="260" y="70" width="140" height="80" rx="10" fill="url(#blueGrad)" filter="url(#glow)"/>
  <text x="330" y="100" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">2. GCP IAP</text>
  <text x="330" y="118" font-family="Arial, sans-serif" font-size="9" fill="#bfdbfe" text-anchor="middle">IAM Check</text>
  <text x="330" y="135" font-family="Arial, sans-serif" font-size="9" fill="#bfdbfe" text-anchor="middle">TCP Forward</text>
  
  <!-- Arrow 2-3 -->
  <path d="M400 110 L460 110" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="430" y="100" font-family="Arial, sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">35.235.240.0/20</text>
  
  <!-- Step 3: Firewall -->
  <rect x="470" y="70" width="140" height="80" rx="10" fill="url(#orangeGrad)" filter="url(#glow)"/>
  <text x="540" y="100" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3. VPC Firewall</text>
  <text x="540" y="118" font-family="Arial, sans-serif" font-size="9" fill="#fed7aa" text-anchor="middle">allow-iap-ssh</text>
  <text x="540" y="135" font-family="Arial, sans-serif" font-size="9" fill="#fed7aa" text-anchor="middle">tcp:22</text>
  
  <!-- Arrow 3-4 -->
  <path d="M610 110 L670 110" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="100" font-family="Arial, sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">TCP 22</text>
  
  <!-- Step 4: Windows VM -->
  <rect x="680" y="70" width="170" height="80" rx="10" fill="url(#greenGrad)" filter="url(#glow)"/>
  <text x="765" y="100" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">4. Windows VM</text>
  <text x="765" y="118" font-family="Arial, sans-serif" font-size="9" fill="#bbf7d0" text-anchor="middle">OpenSSH :22</text>
  <text x="765" y="135" font-family="Arial, sans-serif" font-size="9" fill="#bbf7d0" text-anchor="middle">Public Key Auth</text>
  
  <!-- Detailed Flow Section -->
  <rect x="50" y="180" width="800" height="280" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="450" y="205" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="middle">Detailed Authentication Flow</text>
  
  <!-- Flow boxes -->
  <!-- Box 1 -->
  <rect x="80" y="230" width="150" height="90" rx="8" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
  <text x="155" y="255" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#a5b4fc" text-anchor="middle">Start IAP Tunnel</text>
  <text x="155" y="275" font-family="Arial, sans-serif" font-size="8" fill="#c7d2fe" text-anchor="middle">gcloud compute</text>
  <text x="155" y="290" font-family="Arial, sans-serif" font-size="8" fill="#c7d2fe" text-anchor="middle">start-iap-tunnel</text>
  <text x="155" y="305" font-family="Arial, sans-serif" font-size="8" fill="#c7d2fe" text-anchor="middle">localhost:2222</text>
  
  <!-- Arrow -->
  <path d="M230 275 L280 275" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Box 2 -->
  <rect x="290" y="230" width="150" height="90" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="365" y="255" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#93c5fd" text-anchor="middle">IAM Authorization</text>
  <text x="365" y="275" font-family="Arial, sans-serif" font-size="8" fill="#bfdbfe" text-anchor="middle">Check permission:</text>
  <text x="365" y="290" font-family="Arial, sans-serif" font-size="8" fill="#bfdbfe" text-anchor="middle">tunnelResource</text>
  <text x="365" y="305" font-family="Arial, sans-serif" font-size="8" fill="#bfdbfe" text-anchor="middle">Accessor</text>
  
  <!-- Arrow -->
  <path d="M440 275 L490 275" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Box 3 -->
  <rect x="500" y="230" width="150" height="90" rx="8" fill="#7c2d12" stroke="#f97316" stroke-width="1"/>
  <text x="575" y="255" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fdba74" text-anchor="middle">Firewall Check</text>
  <text x="575" y="275" font-family="Arial, sans-serif" font-size="8" fill="#fed7aa" text-anchor="middle">Source: IAP CIDR</text>
  <text x="575" y="290" font-family="Arial, sans-serif" font-size="8" fill="#fed7aa" text-anchor="middle">Dest: VM TCP 22</text>
  <text x="575" y="305" font-family="Arial, sans-serif" font-size="8" fill="#fed7aa" text-anchor="middle">Action: ALLOW</text>
  
  <!-- Arrow -->
  <path d="M650 275 L700 275" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Box 4 -->
  <rect x="710" y="230" width="120" height="90" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
  <text x="770" y="255" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#86efac" text-anchor="middle">SSH Auth</text>
  <text x="770" y="275" font-family="Arial, sans-serif" font-size="8" fill="#bbf7d0" text-anchor="middle">Public Key</text>
  <text x="770" y="290" font-family="Arial, sans-serif" font-size="8" fill="#bbf7d0" text-anchor="middle">Verification</text>
  <text x="770" y="305" font-family="Arial, sans-serif" font-size="8" fill="#bbf7d0" text-anchor="middle">✓ Authenticated</text>
  
  <!-- SSH Command Box -->
  <rect x="80" y="340" width="750" height="100" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="100" y="365" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#e2e8f0">SSH Command:</text>
  <text x="100" y="390" font-family="Consolas, monospace" font-size="10" fill="#22d3ee">ssh -i ~/.ssh/windows_vsts -p 2222 vsts@localhost</text>
  <text x="100" y="415" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">With debugging:</text>
  <text x="100" y="430" font-family="Consolas, monospace" font-size="9" fill="#a78bfa">ssh -vvv -o PreferredAuthentications=publickey -o PasswordAuthentication=no -i ~/.ssh/windows_vsts -p 2222 vsts@localhost</text>
</svg>