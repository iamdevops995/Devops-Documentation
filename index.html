<!-- Dark mode color fix - MUST run after docsify loads -->
<script>
(function() {
  'use strict';
  
  function forceDarkModeColors() {
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark' ||
                 document.body.getAttribute('data-theme') === 'dark';
    
    if (!isDark) {
      // Remove forced styles when in light mode
      document.querySelectorAll('[data-dark-styled]').forEach(function(el) {
        el.removeAttribute('style');
        el.removeAttribute('data-dark-styled');
      });
      return;
    }
    
    // Force heading colors with inline styles (highest specificity)
    var headings = document.querySelectorAll('.markdown-section h1, .markdown-section h2, .markdown-section h3, .markdown-section h4, .markdown-section h5, .markdown-section h6, article h1, article h2, article h3, article h4');
    headings.forEach(function(h) {
      h.style.setProperty('color', '#ffffff', 'important');
      h.setAttribute('data-dark-styled', 'true');
      // Also handle anchor inside heading
      var anchors = h.querySelectorAll('a');
      anchors.forEach(function(a) {
        a.style.setProperty('color', '#ffffff', 'important');
        a.setAttribute('data-dark-styled', 'true');
      });
    });
    
    // Force paragraph and list item colors
    var textElements = document.querySelectorAll('.markdown-section p, .markdown-section li, .markdown-section td, article p, article li');
    textElements.forEach(function(el) {
      el.style.setProperty('color', '#c4c4d4', 'important');
      el.setAttribute('data-dark-styled', 'true');
    });
    
    // Force strong/bold colors
    var strongElements = document.querySelectorAll('.markdown-section strong, .markdown-section b, article strong, article b');
    strongElements.forEach(function(el) {
      el.style.setProperty('color', '#ffffff', 'important');
      el.setAttribute('data-dark-styled', 'true');
    });
    
    // Force link colors (not headings)
    var links = document.querySelectorAll('.markdown-section a:not(h1 a):not(h2 a):not(h3 a):not(h4 a), article a:not(h1 a):not(h2 a):not(h3 a):not(h4 a)');
    links.forEach(function(a) {
      if (!a.closest('h1') && !a.closest('h2') && !a.closest('h3') && !a.closest('h4')) {
        a.style.setProperty('color', '#60a5fa', 'important');
        a.setAttribute('data-dark-styled', 'true');
      }
    });
    
    // Force blockquote colors
    var blockquotes = document.querySelectorAll('.markdown-section blockquote, article blockquote');
    blockquotes.forEach(function(bq) {
      bq.style.setProperty('background', '#1e293b', 'important');
      bq.style.setProperty('border-left-color', '#3b82f6', 'important');
      bq.setAttribute('data-dark-styled', 'true');
      var bqText = bq.querySelectorAll('p, span, *');
      bqText.forEach(function(el) {
        el.style.setProperty('color', '#cbd5e1', 'important');
        el.setAttribute('data-dark-styled', 'true');
      });
    });
    
    // Force inline code colors
    var inlineCode = document.querySelectorAll('.markdown-section code:not(pre code), article code:not(pre code)');
    inlineCode.forEach(function(c) {
      c.style.setProperty('background', '#252540', 'important');
      c.style.setProperty('color', '#60a5fa', 'important');
      c.setAttribute('data-dark-styled', 'true');
    });
    
    // Force table colors
    var tables = document.querySelectorAll('.markdown-section table, article table');
    tables.forEach(function(t) {
      t.style.setProperty('background', '#1a1a2e', 'important');
      t.setAttribute('data-dark-styled', 'true');
    });
    
    var ths = document.querySelectorAll('.markdown-section th, article th');
    ths.forEach(function(th) {
      th.style.setProperty('background', '#252540', 'important');
      th.style.setProperty('color', '#60a5fa', 'important');
      th.setAttribute('data-dark-styled', 'true');
    });
  }
  
  // Register as docsify plugin - runs after each page render
  window.$docsify = window.$docsify || {};
  window.$docsify.plugins = (window.$docsify.plugins || []).concat(function(hook) {
    hook.doneEach(function() {
      // Small delay to ensure DOM is fully updated
      setTimeout(forceDarkModeColors, 50);
      setTimeout(forceDarkModeColors, 200);
    });
  });
  
  // Also watch for theme attribute changes
  var observer = new MutationObserver(function(mutations) {
    mutations.forEach(function(mutation) {
      if (mutation.attributeName === 'data-theme') {
        setTimeout(forceDarkModeColors, 50);
      }
    });
  });
  
  // Start observing when DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
      observer.observe(document.documentElement, { attributes: true });
      observer.observe(document.body, { attributes: true });
      forceDarkModeColors();
    });
  } else {
    observer.observe(document.documentElement, { attributes: true });
    if (document.body) {
      observer.observe(document.body, { attributes: true });
    }
    forceDarkModeColors();
  }
})();
</script>
