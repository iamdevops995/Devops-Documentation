<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DevOps Documentation</title>
  <meta name="description" content="DevOps Documentation by Logesh Kumar — AWS, Azure, GCP, Kubernetes, Docker, Terraform, Ansible, Jenkins, Linux and more.">
  <meta name="theme-color" content="#2563eb">

  <!-- Inline SVG favicon: no external request, no 404 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M20 20l-9 12 9 12' fill='none' stroke='white' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M44 20l9 12-9 12' fill='none' stroke='white' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M36 16L28 48' fill='none' stroke='%23bfdbfe' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">

  <!-- Base theme + syntax highlighting -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1/themes/prism.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">

  <!-- Custom styles (responsive.css must stay last) -->
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/navbar.css">
  <link rel="stylesheet" href="assets/css/sidebar.css">
  <link rel="stylesheet" href="assets/css/hero.css">
  <link rel="stylesheet" href="assets/css/cards.css">
  <link rel="stylesheet" href="assets/css/tables.css">
  <link rel="stylesheet" href="assets/css/code.css">
  <link rel="stylesheet" href="assets/css/custom.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>

<body>

<div id="app">Loading Documentation…</div>

<script>
window.$docsify = {

  name: '<span class="brand">' +
          '<span class="brand-icon"><i class="fas fa-infinity" aria-hidden="true"></i></span>' +
          '<span class="brand-text">' +
            '<strong>DevOps Docs</strong>' +
            '<small>Cloud · Platform · Automation</small>' +
          '</span>' +
        '</span>',

  nameLink: '#/',

  repo: 'iamdevops995/Devops-Documentation',

  homepage: 'README.md',

  loadSidebar: true,

  loadNavbar: true,

  /* The landing page in README.md is the entry point, so the cover is off. */
  coverpage: false,

  auto2top: true,

  mergeNavbar: true,

  maxLevel: 4,

  /* 0 because _sidebar.md already nests down to individual topics. */
  subMaxLevel: 0,

  /* Absolute sidebar links are resolved the same way from every page. */
  relativePath: false,

  executeScript: true,

  /* 0 = every category starts collapsed; the branch holding the current
     page is expanded automatically by docsify-sidebar-collapse. */
  sidebarDisplayLevel: 0,

  /* Reuse the root sidebar/navbar inside every subfolder. */
  alias: {
    '/.*/_sidebar.md': '/_sidebar.md',
    '/.*/_navbar.md': '/_navbar.md'
  },

  search: {
    placeholder: 'Search documentation…',
    noData: 'No results found',
    depth: 6,
    hideOtherSidebarContent: false
  },

  pagination: {
    previousText: 'Previous',
    nextText: 'Next',
    crossChapter: true,
    crossChapterText: true
  },

  copyCode: {
    buttonText: 'Copy',
    errorText: 'Error',
    successText: 'Copied'
  }

}
</script>

<!-- Local plugins: must load before docsify so they can register themselves -->
<script src="assets/js/custom.js"></script>
<script src="assets/js/search.js"></script>

<!-- Docsify core -->
<script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

<!-- Plugins -->
<script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/emoji.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse@1/dist/docsify-sidebar-collapse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify-tabs@1"></script>

<!-- Diagrams -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2/dist/docsify-mermaid.js"></script>
<script>
  if (window.mermaid) {
    mermaid.initialize({ startOnLoad: false, theme: 'neutral' });
  }
</script>

</body>
</html>
